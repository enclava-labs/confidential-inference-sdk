[advisories]
version = 2
# RUSTSEC-2024-0449: serde_yaml is deprecated and its unsafe-libyaml backend is
# unmaintained. We use it only for dynamic Value parsing of dstack compose
# evidence. shortcut: swap for a safe-Rust YAML crate (saphyr) if/when the
# parser rewrite is justified; no vulnerability is being ignored here.
ignore = ["RUSTSEC-2024-0449"]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
