name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  offline-security:
    name: Offline SDK and corpus gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy rustfmt

      - name: Select stable Rust
        run: rustup default stable

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Workspace tests
        run: cargo test --workspace --locked --quiet

      - name: DCAP QVL dependency audit fixture
        run: cargo test -p confidential-inference-providers --test dcap_qvl_audit --locked

      - name: Fuzz target build when targets are checked in
        run: |
          if [ -d fuzz ]; then
            cargo install --locked cargo-fuzz
            cargo fuzz build
          else
            echo "No fuzz targets checked in; offline corpus tests are covered by cargo test --workspace."
          fi

      - name: Local end-to-end demo
        run: |
          set -o pipefail
          cargo run -p confidential-demo --locked | tee target/confidential-demo.out
          python3 tools/check_demo_output.py target/confidential-demo.out

      - name: Normative fixture policy
        run: python3 tools/check_normative_fixtures.py

      - name: FFI export policy
        run: python3 tools/check_ffi_exports.py

      - name: FFI build
        run: cargo build -p confidential-inference-ffi --locked

      - name: Set up minimum supported Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Python binding tests
        run: python3 -m unittest discover -s bindings/python/tests

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json

      - name: Node binding dependencies
        run: npm ci
        working-directory: bindings/node

      - name: Node binding tests
        run: npm test
        working-directory: bindings/node

  live-conformance:
    name: Live conformance dry run
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate live conformance plan without network
        run: python3 tools/live_conformance.py --output target/live-conformance-disabled-network.json

  supply-chain:
    name: Supply-chain gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.19.9

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2

      - name: Cargo deny
        run: cargo deny check

      - name: Cargo audit
        run: cargo audit --ignore RUSTSEC-2023-0071

      - name: Supply-chain policy
        run: python3 tools/check_supply_chain_policy.py

      - name: Release packaging
        run: python3 tools/check_release_packaging.py

      - name: SBOM
        run: python3 tools/generate_sbom.py --output target/confidential-inference-sbom.json --check

      - name: Release checksum manifest
        run: python3 tools/generate_release_manifest.py --artifact-glob 'target/package/*.crate' --artifact target/confidential-inference-sbom.json --sbom target/confidential-inference-sbom.json --output target/confidential-inference-release-manifest.json --check

      - name: Release checksum manifest policy
        run: python3 tools/check_release_manifest.py --manifest target/confidential-inference-release-manifest.json --artifact-glob 'target/package/*.crate' --artifact target/confidential-inference-sbom.json --sbom target/confidential-inference-sbom.json

      - name: Release checksum manifest signature fixture
        env:
          CONFIDENTIAL_INFERENCE_RELEASE_CI_SIGNING_KEY_SEED_BASE64URL: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8
        run: python3 tools/generate_release_manifest.py --artifact-glob 'target/package/*.crate' --artifact target/confidential-inference-sbom.json --sbom target/confidential-inference-sbom.json --output target/confidential-inference-release-manifest.json --signature-output target/confidential-inference-release-manifest.ci.sig.json --signature-key-seed-env CONFIDENTIAL_INFERENCE_RELEASE_CI_SIGNING_KEY_SEED_BASE64URL --signature-signer confidential-inference-release-ci --signature-key-id release-ci-key --check

      - name: Release checksum manifest signature policy
        run: python3 tools/check_release_manifest.py --manifest target/confidential-inference-release-manifest.json --artifact-glob 'target/package/*.crate' --artifact target/confidential-inference-sbom.json --sbom target/confidential-inference-sbom.json --signature target/confidential-inference-release-manifest.ci.sig.json --trusted-release-key confidential-inference-release-ci:release-ci-key:A6EHv_POEL4dcN0Y50vAmWfk1jCbpQ1fHdyGZBJVMbg

      - name: CI workflow policy
        run: python3 tools/check_ci_workflow.py

      - name: Tooling unit tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
