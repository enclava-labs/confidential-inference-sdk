[package]
name = "confidential-inference-providers"
description = "Provider registry and adapter traits for the Confidential Inference SDK."
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
async-trait.workspace = true
base64 = { version = "0.23", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
dcap-qvl = { version = "0.6.1", default-features = false, features = ["std", "ring", "default-x509", "report"] }
confidential-inference-attestation = { version = "0.1.0", path = "../confidential-inference-attestation" }
confidential-inference-openai = { version = "0.1.0", path = "../confidential-inference-openai" }
flate2.workspace = true
getrandom.workspace = true
hkdf = "0.13"
ml-kem = { version = "0.3.2", features = ["getrandom", "zeroize"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls-no-provider", "json", "query"] }
rustls = { version = "0.23.4", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
x25519-dalek = { version = "3", features = ["getrandom", "static_secrets"] }
zeroize.workspace = true

[dev-dependencies]
ed25519-compact = { version = "2.1.1", default-features = false, features = ["std"] }
ring = "0.17"
tokio-rustls = { version = "0.26", default-features = false }
