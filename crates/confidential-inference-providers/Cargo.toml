[package]
name = "confidential-inference-providers"
description = "Provider registry and adapter traits for the Confidential Inference SDK."
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
async-trait.workspace = true
base64 = "0.22"
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
dcap-qvl = { version = "0.6.1", default-features = false, features = ["std", "ring", "default-x509", "report"] }
confidential-inference-attestation = { version = "0.1.0", path = "../confidential-inference-attestation" }
confidential-inference-openai = { version = "0.1.0", path = "../confidential-inference-openai" }
hkdf = "0.12"
k256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls-no-provider", "json", "query"] }
rustls = { version = "0.23.4", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha3 = "0.10"
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize.workspace = true

[dev-dependencies]
ed25519-compact = { version = "2.1.1", default-features = false, features = ["std"] }
flate2.workspace = true
ring = "0.17"
tokio-rustls = { version = "0.26", default-features = false }
